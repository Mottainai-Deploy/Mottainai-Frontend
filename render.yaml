services:
  - type: web
    name: mottainai-admin-deploy
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://mottainai-operational-api.onrender.com/api/v1
      - key: VITE_FIREBASE_AUTH_URL
        value: https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword
      - key: VITE_FIREBASE_API_KEY
        sync: false
